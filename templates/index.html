<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Social Media Links</title>
  <style>
    :root{
      --bg:#0f1724;
      --card:#0b1220;
      --glass: rgba(255,255,255,0.04);
      --accent1: linear-gradient(135deg,#8b5cf6,#06b6d4);
      --accent2: linear-gradient(135deg,#f97316,#ef4444);
      --text:#e6eef8;
      --muted:rgba(230,238,248,0.7);
      --radius:14px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background: radial-gradient(1000px 600px at 10% 10%, rgba(99,102,241,0.12), transparent),
                  radial-gradient(900px 500px at 90% 90%, rgba(6,182,212,0.06), transparent),
                  var(--bg);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
    }
    .container{
      width:100%;
      max-width:920px;
      background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:20px;
      padding:28px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.03);
    }
    header{
      display:flex;
      gap:18px;
      align-items:center;
      margin-bottom:18px;
    }
    .avatar{
      width:64px;height:64px;border-radius:12px;background:var(--glass);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);
      backdrop-filter: blur(6px);
      border:1px solid rgba(255,255,255,0.03);
    }
    h1{font-size:20px;margin:0}
    p.lead{margin:0;color:var(--muted);font-size:14px}

    .links{
      display:grid;
      grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
      gap:14px;
      margin-top:20px;
    }

    a.link-card{
      display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;text-decoration:none;
      background:linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.008));
      border:1px solid rgba(255,255,255,0.03);
      transition: transform .18s ease, box-shadow .18s ease, opacity .12s ease;
      color:var(--text);
    }
    a.link-card:hover{transform: translateY(-6px);box-shadow:0 12px 30px rgba(2,6,23,0.6)}
    .icon-wrap{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .info{flex:1}
    .title{font-weight:700;margin:0 0 4px 0}
    .subtitle{font-size:13px;color:var(--muted);margin:0}

    /* Each link's icon background styles */
    .instagram{background: linear-gradient(135deg,#F58529 0%,#DD2A7B 50%,#515BD4 100%)}
    .linkedin{background: linear-gradient(135deg,#0A66C2 0%,#0077B5 100%)}
    .github{background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.04), transparent), #111827}
    .facebook{background: linear-gradient(135deg,#1877F2 0%,#0A58CA 100%)}
    .youtube{background: linear-gradient(135deg,#FF0000 0%,#FF4A4A 100%)}
    .leetcode{background: linear-gradient(135deg,#F7931E 0%,#FFB86B 100%)}
    .others{background: linear-gradient(135deg,#8B5CF6 0%,#06B6D4 100%)}

    /* small helper */
    .hint{font-size:12px;color:var(--muted);margin-top:12px}

    @media (max-width:520px){
      .avatar{width:52px;height:52px}
      .icon-wrap{width:48px;height:48px}
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="avatar">Links</div>
      <div>
        <h1>Prashant's Social Media Links</h1>
        
      </div>
    </header>

    <main class="links">
      <!-- Instagram -->
      <a class="link-card" href="https://www.instagram.com/prashu._2/" target="_blank" rel="noopener noreferrer" aria-label="Instagram profile">
        <div class="icon-wrap instagram" title="Instagram">
          <!-- simple camera svg -->
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="white" stroke-width="1.4" fill="none" opacity="0.95"/>
            <circle cx="12" cy="12" r="3" stroke="white" stroke-width="1.4" fill="none"/>
            <circle cx="17.5" cy="6.5" r="0.8" fill="white"/>
          </svg>
        </div>
        <div class="info">
          <p class="title">Instagram</p>
    
        </div>
      </a>

      <!-- LinkedIn -->
      <a class="link-card" href="http://linkedin.com/in/prashant-ravindra-chauhan/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
        <div class="icon-wrap linkedin">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="white" stroke-width="1.2" opacity="0.95"/>

          </svg>
        </div>
        <div class="info">
          <p class="title">LinkedIn</p>
          
        </div>
      </a>

      <!-- GitHub -->
      <a class="link-card" href="https://github.com/PrashantRchauhan" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">
        <div class="icon-wrap github">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <path d="M12 .5a12 12 0 00-3.79 23.4c.6.11.82-.26.82-.58v-2.1c-3.34.73-4.04-1.6-4.04-1.6-.55-1.4-1.34-1.78-1.34-1.78-1.1-.75.08-.73.08-.73 1.22.09 1.86 1.26 1.86 1.26 1.08 1.85 2.83 1.32 3.52 1.01.11-.78.42-1.32.76-1.62-2.66-.3-5.46-1.33-5.46-5.92 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 016 0c2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.9 1.24 3.22 0 4.6-2.8 5.61-5.47 5.91.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.82.58A12 12 0 0012 .5z"/>
          </svg>
        </div>
        <div class="info">
          <p class="title">GitHub</p>
         
        </div>
      </a>

      <!-- Facebook -->
      <a class="link-card" href="https://www.facebook.com/profile.php?id=100076239113882" target="_blank" rel="noopener noreferrer" aria-label="Facebook profile">
        <div class="icon-wrap facebook">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <path d="M15 3h2V0h-3a4 4 0 00-4 4v2H8v3h2v8h3v-8h2.5l.5-3H13V4a1 1 0 011-1h1z"/>
          </svg>
        </div>
        <div class="info">
          <p class="title">Facebook</p>
          
        </div>
      </a>

      <!-- YouTube -->
      <a class="link-card" href="https://www.youtube.com/@choriking213" target="_blank" rel="noopener noreferrer" aria-label="YouTube channel">
        <div class="icon-wrap youtube">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <path d="M23.5 7.1s-.2-1.6-.8-2.3c-.8-.9-1.7-.9-2.1-1C16.6 3 12 3 12 3s-4.6 0-8.6.8c-.4.1-1.3.1-2.1 1C.7 5.5.5 7.1.5 7.1S0 9.1 0 11.1v1.7c0 2 .5 4 5.5 4 4 0 8.6.9 8.6.9s4.6-1 8.6-1c5 0 5.5-2 5.5-4v-1.7c0-2-.5-4-5.5-4zM9.7 14.5V8.5l5 3z"/>
          </svg>
        </div>
        <div class="info">
          <p class="title">YouTube</p>
         
        </div>
      </a>

      <!-- LeetCode -->
      <a class="link-card" href="https://leetcode.com/u/Prashant_chauhan2003/" target="_blank" rel="noopener noreferrer" aria-label="LeetCode profile">
        <div class="icon-wrap leetcode">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <path d="M12 2l4 4-3 3-4-4 3-3zM2 12l4-4 3 3-4 4-3-3zM12 22l-4-4 3-3 4 4-3 3zM22 12l-4 4-3-3 4-4 3 3z"/>
          </svg>
        </div>
        <div class="info">
          <p class="title">LeetCode</p>
      
        </div>
      </a>

    </main>

   
  </div>
</body>
</html>
